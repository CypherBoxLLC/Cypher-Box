apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: bake .env values into BuildConfig + resources at compile
// time so JS can read them via the bridged module. Without this `apply from`,
// the JS side gets undefined for every key — see the [Ark/Drive bootstrap]
// runtime warning that surfaced on the first Galaxy A14 install attempt. The
// dotenv.gradle script reads `<project root>/.env` (gitignored, copied from
// `.env.example`); per-environment files like `.env.staging` can be selected
// at build time via `ENVFILE=.env.staging ./gradlew assembleDebug`.
// Direct file path (not project(':react-native-config')) because RN 0.76
// autolinking registers the lib under a dynamic project name, so the
// classic `project(':react-native-config').projectDir` lookup fails with
// "Project with path ':react-native-config' could not be found".
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc-intl:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "io.cypherbox.btc"
    defaultConfig {
        applicationId "io.cypherbox.btc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "0.1.0"
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        missingDimensionStrategy 'react-native-camera', 'general' //add this line
        manifestPlaceholders["appAuthRedirectScheme"] = "cypherbox" // Add this line
        // Only ship ARM ABIs — x86/x86_64 are emulator-only and bloat the APK
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Pick first on duplicate resources (fixes RN 0.72 bundler conflict)
        resources {
            pickFirsts += ['**/*.png', '**/*.xml']
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'cypherbox-upload-key.jks')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias'] ?: 'upload'
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            minifyEnabled enableProguardInReleaseBuilds
            // Sign only when keystore.properties is present (local/manual release
            // signing per security-plan §4.2). CI, container, and reproducible
            // builds run WITHOUT it and emit an UNSIGNED aab/apk, keeping the
            // upload key out of the build path (§5). Signing is then a separate
            // manual step with the YubiKey-protected age-encrypted key.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation files("../../node_modules/rn-ldk/android/libs/LDK-release.aar")
    implementation 'com.facebook.fresco:animated-gif:2.5.0' // Enables GIF support
    // implementation 'com.github.uccmawei:FingerprintIdentify:1.2.6'
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    androidTestImplementation('com.wix:detox:+')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // WorkManager backs the Ark background-refresh worker. 2.9.0 matches the
    // androidx baseline used elsewhere in the project (compileSdk 35) and
    // supports the periodic-work APIs we use.
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    // DocumentFile backs the Storage Access Framework (SAF) bridge for the
    // user-chosen local backup folder (ArkSafBackupModule). Used to resolve
    // the persisted tree URI into a writable DocumentFile and create / read
    // the ark-backup.cbark inside it without needing READ/WRITE_EXTERNAL_STORAGE.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
apply plugin: 'com.google.gms.google-services'  // Google Services plugin

// Old RN 0.72 autolinking removed — RN 0.76 uses com.facebook.react.settings plugin in settings.gradle
// apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: bake .env values into BuildConfig + resources at compile
// time so JS can read them via the bridged module. Without this `apply from`,
// the JS side gets undefined for every key — see the [Ark/Drive bootstrap]
// runtime warning that surfaced on the first Galaxy A14 install attempt. The
// dotenv.gradle script reads `<project root>/.env` (gitignored, copied from
// `.env.example`); per-environment files like `.env.staging` can be selected
// at build time via `ENVFILE=.env.staging ./gradlew assembleDebug`.
// Direct file path (not project(':react-native-config')) because RN 0.76
// autolinking registers the lib under a dynamic project name, so the
// classic `project(':react-native-config').projectDir` lookup fails with
// "Project with path ':react-native-config' could not be found".
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Runs R8 on release builds: shrinks, optimizes and obfuscates the Java/Kotlin bytecode.
 * Google Play rates DEX code optimization and warns below 25% obfuscation (it was 1%).
 * Code that is reached only by reflection or from native code needs a keep rule in
 * proguard-rules.pro; most libraries ship their own (consumer rules). R8 writes
 * build/outputs/mapping/release/mapping.txt; Play reads it from the bundle, and it is
 * what turns an obfuscated Java stack trace back into names.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc-intl:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "io.cypherbox.btc"
    defaultConfig {
        applicationId "io.cypherbox.btc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 44
        versionName "0.1.13"
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        missingDimensionStrategy 'react-native-camera', 'general' //add this line
        manifestPlaceholders["appAuthRedirectScheme"] = "cypherbox" // Add this line
        // arm64-v8a ONLY. Do NOT add armeabi-v7a back: the ship build compiles
        // native modules with -PreactNativeArchitectures=arm64-v8a, so an
        // armeabi-v7a split ships WITHOUT Realm, Reanimated, the bark JSI lib and
        // others, which crashes every 32-bit device at launch (UnsatisfiedLinkError).
        // Play then simply reports the app as incompatible on 32-bit rather than
        // serving a broken build. x86/x86_64 are emulator-only.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packagingOptions {
        jniLibs {
            // 16 KB (Android 15): false => native libs stored UNCOMPRESSED and
            // page-aligned in the APK so they can be mmap'd directly. Required
            // for 16 KB page-size support (was true / legacy-compressed).
            useLegacyPackaging = false
            // Facebook Conceal's prebuilt libconceal.so, which react-native-keychain 8.1.2
            // bundles for its "FacebookConceal" cipher. Play flags it for 16 KB devices: it
            // was built with an old NDK. Nothing loads it here. Conceal calls
            // System.loadLibrary only from Crypto.isAvailable(), which the keychain reaches
            // only when encrypting or decrypting with that cipher, and on Android 6+ (this
            // app needs 7) the keychain uses the Android Keystore ciphers. The app never
            // asks for Conceal. Drop this once react-native-keychain no longer ships it.
            excludes += ['**/libconceal.so']
        }
        // Pick first on duplicate resources (fixes RN 0.72 bundler conflict)
        resources {
            pickFirsts += ['**/*.png', '**/*.xml']
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'cypherbox-upload-key.jks')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias'] ?: 'upload'
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            minifyEnabled enableProguardInReleaseBuilds
            // Sign only when keystore.properties is present (local/manual release
            // signing per security-plan §4.2). CI, container, and reproducible
            // builds run WITHOUT it and emit an UNSIGNED aab/apk, keeping the
            // upload key out of the build path (§5). Signing is then a separate
            // manual step with the YubiKey-protected age-encrypted key.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // The -optimize defaults: plain proguard-android.txt turns R8's optimization off
            // (-dontoptimize), which is what Play's optimization score reads.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

// R8 reports each run in the release bundle, at BUNDLE-METADATA/com.android.tools/r8.json, and the report
// includes how long R8 ran (buildTimeNs) and how many threads it used. Both change on every build and every
// machine, so once R8 was turned on no two builds of the same commit produced the same AAB, and the
// reproducible-build check (build-verify.yml) failed every time. AGP has no option to leave the report out,
// and the rest of it is worth keeping (the dex checksums and the shrink and obfuscation figures), so both
// numbers are set to 0 as soon as R8 has written them. R8's own output, the dex and its mapping, is stable.
tasks.matching { it.name ==~ /minify\w*WithR8/ }.configureEach { r8Task ->
    r8Task.doLast {
        def report = r8Task.r8Metadata.get().asFile
        if (report.exists()) {
            report.text = report.text
                .replaceAll(/"buildTimeNs":\d+/, '"buildTimeNs":0')
                .replaceAll(/"numberOfThreads":\d+/, '"numberOfThreads":0')
        }
    }
}

// The release bundle carries the native debug symbol tables, at
// BUNDLE-METADATA/com.android.tools.build.debugsymbols/<abi>/*.so.sym, and Play uses them to symbolicate
// native crashes. AGP adds them in the order the disk lists the directory that holds them. On ext4 that order
// comes from the file system's hash seed, so it stays the same on one machine but changes from one machine to
// the next. Two CI runners built the same commit into bundles whose entries were all byte-identical, yet the
// symbol tables came in a different order and the two SHA-256s differed. The list cannot be handed to AGP
// sorted: the task reads that directory itself while it runs, from a file list AGP locks before any build
// script can change it. So the entries are put in name order as soon as the bundle is written, before it is
// finalized and copied to outputs/bundle. Each entry keeps its header and compressed bytes exactly; only the
// order and the offsets in the zip index change.
tasks.withType(com.android.build.gradle.internal.tasks.PackageBundleTask).configureEach { bundleTask ->
    bundleTask.doLast {
        def bundle = bundleTask.bundleFile.get().asFile
        int moved = sortDebugSymbolEntries(bundle)
        if (moved > 0) {
            logger.lifecycle("Put the ${moved} native debug symbol entries of ${bundle.name} in name order")
        }
    }
}

// Rewrites a bundle (a zip) with its native debug symbol entries in name order and returns how many there
// are, or 0 when they were already in order and the file was left alone. Nothing is decompressed or
// recompressed: each entry is copied byte for byte, its local header, data and data descriptor together, and
// only the offsets in the central directory change. Anything unexpected in the zip stops the build rather
// than risk shipping a broken bundle.
int sortDebugSymbolEntries(File bundle) {
    final String symbolDir = 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'
    byte[] zip = bundle.bytes
    def buf = java.nio.ByteBuffer.wrap(zip).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    def fail = { String why -> throw new GradleException("Cannot sort the debug symbols in ${bundle}: ${why}") }

    // End of central directory record: 22 bytes, then a comment of up to 64 KiB.
    int eocd = -1
    for (int at = zip.length - 22; at >= Math.max(0, zip.length - 22 - 0xffff); at--) {
        if (buf.getInt(at) == 0x06054b50 && at + 22 + (buf.getShort(at + 20) & 0xffff) == zip.length) {
            eocd = at
            break
        }
    }
    if (eocd < 0) fail('no end of central directory record')
    if (eocd >= 20 && buf.getInt(eocd - 20) == 0x07064b50) fail('zip64 is not handled')
    int count = buf.getShort(eocd + 10) & 0xffff
    long cdSize = buf.getInt(eocd + 12) & 0xffffffffL
    long cdOffset = buf.getInt(eocd + 16) & 0xffffffffL
    if ((buf.getShort(eocd + 8) & 0xffff) != count) fail('a zip split over several disks is not handled')
    if (count == 0) return 0

    def entries = []
    int p = (int) cdOffset
    for (int i = 0; i < count; i++) {
        if (p + 46 > eocd || buf.getInt(p) != 0x02014b50) fail("central directory entry ${i} is malformed")
        int nameLength = buf.getShort(p + 28) & 0xffff
        int length = 46 + nameLength + (buf.getShort(p + 30) & 0xffff) + (buf.getShort(p + 32) & 0xffff)
        long local = buf.getInt(p + 42) & 0xffffffffL
        entries << [name: new String(zip, p + 46, nameLength, 'UTF-8'), cd: p, cdLength: length, local: local]
        p += length
    }
    if (p != cdOffset + cdSize || p != eocd) fail('the central directory does not end where the end record starts')

    // Each entry's bytes run from its local header to the next entry's local header, or to the central directory.
    def byOffset = entries.sort(false) { it.local }
    if (byOffset[0].local != 0) fail('there are bytes before the first entry')
    byOffset.eachWithIndex { e, i ->
        e.end = i + 1 < byOffset.size() ? byOffset[i + 1].local : cdOffset
        if (e.end <= e.local || buf.getInt((int) e.local) != 0x04034b50) fail("the local header of ${e.name} is malformed")
    }

    // Keep every other entry where it is and fill the symbol tables' places in name order.
    def slots = (0..<entries.size()).findAll { entries[it].name.startsWith(symbolDir) }
    def symbols = slots.collect { entries[it] }
    def sorted = symbols.sort(false) { it.name }
    if (sorted*.name == symbols*.name) return 0
    def order = new ArrayList(entries)
    slots.eachWithIndex { slot, i -> order[slot] = sorted[i] }

    File rewritten = new File(bundle.parentFile, "${bundle.name}.sorting")
    rewritten.withOutputStream { out ->
        def newOffset = [:]
        long written = 0
        order.each { e ->
            newOffset[e.name] = written
            out.write(zip, (int) e.local, (int) (e.end - e.local))
            written += e.end - e.local
        }
        if (written != cdOffset) fail('the entries no longer add up to the central directory offset')
        order.each { e ->
            byte[] header = java.util.Arrays.copyOfRange(zip, e.cd, e.cd + e.cdLength)
            java.nio.ByteBuffer.wrap(header).order(java.nio.ByteOrder.LITTLE_ENDIAN).putInt(42, (int) newOffset[e.name])
            out.write(header)
        }
        // Same entries and sizes, so the end record (count, central directory size and offset) is unchanged.
        out.write(zip, eocd, zip.length - eocd)
    }
    java.nio.file.Files.move(rewritten.toPath(), bundle.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    return symbols.size()
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // rn-ldk (LDK Lightning) removed for Google Play 16 KB page-size compliance.
    // It is a deprecated, unused BlueWallet feature (Cypher Box Lightning is Strike /
    // Coinos / Ark; its add-wallet button is backdoor-gated and unreachable in normal
    // UI). The vendored LDK-release.aar shipped a 4 KB-aligned liblightningjni.so (a
    // 2021 prebuilt with no 16 KB build available), which was the last lib blocking the
    // Play requirement. Android autolinking for rn-ldk is also disabled in
    // react-native.config.js. (Was: implementation files(".../rn-ldk/.../LDK-release.aar"))
    implementation 'com.facebook.fresco:animated-gif:3.4.0' // Enables GIF support (3.4.0 matches RN 0.77 Fresco; ships 16 KB-aligned libgifimage.so for Play)
    // implementation 'com.github.uccmawei:FingerprintIdentify:1.2.6'
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    androidTestImplementation('com.wix:detox:+')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // WorkManager backs the Ark background-refresh worker. 2.9.0 matches the
    // androidx baseline used elsewhere in the project (compileSdk 35) and
    // supports the periodic-work APIs we use.
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    // DocumentFile backs the Storage Access Framework (SAF) bridge for the
    // user-chosen local backup folder (ArkSafBackupModule). Used to resolve
    // the persisted tree URI into a writable DocumentFile and create / read
    // the ark-backup.cbark inside it without needing READ/WRITE_EXTERNAL_STORAGE.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
apply plugin: 'com.google.gms.google-services'  // Google Services plugin

// Old RN 0.72 autolinking removed — RN 0.76 uses com.facebook.react.settings plugin in settings.gradle
// apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

name: PR checks

# Required-status-check candidates for PRs into the protected branches
# (security plan 11.6 secret scan + 11.8 dependency review). Fast, deterministic,
# no secrets. Mark each one required in the ruleset AFTER it has run once
# (GitHub only lists a check as "required-able" once it has reported a status).

on:
  pull_request:
    branches:
      - main
      - CB-Production
      - bark-0.6.3-upgrade

# Least privilege: read the repo + its dependency graph. No write anywhere.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Fails the PR if it INTRODUCES a vulnerable (or otherwise-flagged)
    # dependency, comparing base..head. The repo's pre-existing advisory
    # baseline is out of scope by design - this gate is about *new*
    # supply-chain risk (the #1 threat). Needs the Dependency Graph enabled
    # (on by default for public repos: Settings -> Code security).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  gitleaks:
    # Secret scan of the commits the PR ADDS (base..head) - not the whole tree
    # or full history. The old keystore/passwords live in pre-base history and
    # are a separate purge problem; scanning the range keeps this gate about
    # *new* secrets and avoids failing on inherited false positives. Uses the
    # MIT gitleaks binary directly (sha256-pinned): no third-party action and
    # no org-license gate.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for the PR range)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + verified)
        run: |
          set -euxo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Pin scan config to the base commit
        # The scan must not read its rules from the PR's own merge checkout:
        # a PR could otherwise weaken .gitleaks.toml and scan itself with the
        # weakened rules. Always take the config from the base commit.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euxo pipefail
          git show "${BASE}:.gitleaks.toml" > /tmp/gitleaks-base.toml
      - name: Scan PR commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          gitleaks detect --source . --log-opts="${BASE}..${HEAD}" \
            --redact --exit-code 1 --config /tmp/gitleaks-base.toml

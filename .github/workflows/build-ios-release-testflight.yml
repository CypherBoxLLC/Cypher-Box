name: Build and Upload to TestFlight (iOS)

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
    branches:
      - CB-Production
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - external

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ruby dependencies
        run: |
          cd ios
          bundle install || gem install fastlane

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS
        env:
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
        run: |
          cd ios
          xcodebuild -workspace BlueWallet.xcworkspace \
            -scheme BlueWallet-NoLDK \
            -configuration Release \
            -archivePath ./build/BlueWallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          cd ios
          mkdir -p ./build
          xcodebuild -exportArchive \
            -archivePath ./build/BlueWallet.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypherbox-ios-build
          path: ./ios/build/BlueWallet.ipa

  # Upload to Internal TestFlight (auto on push to CB-Production)
  upload-internal:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push'
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-ios-build
          path: ./build

      - name: Upload to TestFlight (Internal)
        run: |
          altool --upload-app -f ./build/BlueWallet.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_ID_PASSWORD" \
            --output-format xml

  # Upload to External TestFlight (manual trigger from main)
  upload-external:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.inputs.target == 'external'
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-ios-build
          path: ./build

      - name: Upload to TestFlight (External - requires Beta App Review)
        run: |
          echo "⚠️ External TestFlight requires Apple Beta App Review (1-2 days)"
          altool --upload-app -f ./build/BlueWallet.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_ID_PASSWORD" \
            --output-format xml

name: Build and Upload to TestFlight (iOS)

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
    branches:
      - CB-Production
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Ruby dependencies
        run: |
          cd ios
          bundle install || gem install fastlane

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS (without code signing for now)
        env:
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
        run: |
          cd ios
          xcodebuild -workspace BlueWallet.xcworkspace \
            -scheme BlueWallet-NoLDK \
            -configuration Release \
            -archivePath ./build/BlueWallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          cd ios
          mkdir -p ./build
          xcodebuild -exportArchive \
            -archivePath ./build/BlueWallet.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypherbox-ios-build
          path: ./ios/build/BlueWallet.ipa

      - name: Upload to TestFlight
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          # Upload using altool (Apple's tool)
          altool --upload-app -f ./ios/build/BlueWallet.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_ID_PASSWORD" \
            --output-format xml

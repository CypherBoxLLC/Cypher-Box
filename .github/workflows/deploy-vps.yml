name: Deploy GroundControl to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'app-fixed/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/groundcontrol
            git pull origin development
            docker compose down
            docker compose build --no-cache groundcontrol-api
            docker compose up -d groundcontrol-api
            docker compose ps

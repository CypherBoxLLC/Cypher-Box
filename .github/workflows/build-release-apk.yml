name: Build and Upload to Play Store (Android)

on:
  push:
    branches:
      - CB-Development
  pull_request:
    branches:
      - Bam-development
      - CB-Development
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Specify node version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache node_modules for faster install
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      # Cache Gradle for faster builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x ../scripts/build-release-apk.sh
          ../scripts/build-release-apk.sh

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cypherbox-android
          path: ./android/app/build/outputs/apk/release/app-release.apk

      - name: Comment on PR with artifact link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = '✅ **Build complete!**\n\nDownload the APK from the **Actions** tab above, or click the artifact in this run.\n\n**Version:** dev-${'${{ github.sha }}'.substring(0, 7)}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload to GitHub Releases (on merge to CB-Development)
        if: github.event_name == 'push' && contains(github.ref, 'CB-Development')
        uses: softprops/action-gh-release@v1
        with:
          files: ./android/app/build/outputs/apk/release/app-release.apk
          tag_name: android-${{ github.sha }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-internal:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/CB-Production'
    env:
      ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-android
          path: ./build

      - name: Upload to Play Store (Internal Testing)
        run: |
          echo "$ANDROID_SERVICE_ACCOUNT" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          cd android
          bundle exec fastlane supply \
            --json_key ../gcp-key.json \
            --package_name io.cypherbox.app \
            --track internal \
            --apk ../build/app-release.apk

  upload-production:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.inputs.target == 'production'
    env:
      ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-android
          path: ./build

      - name: Upload to Play Store (Production)
        run: |
          echo "$ANDROID_SERVICE_ACCOUNT" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          cd android
          bundle exec fastlane supply \
            --json_key ../gcp-key.json \
            --package_name io.cypherbox.app \
            --track production \
            --apk ../build/app-release.apk

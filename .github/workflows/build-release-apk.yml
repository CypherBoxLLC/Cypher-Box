name: BuildReleaseApk
on:
  push:
    branches:
      - Bam-development
  pull_request:
    branches:
      - Bam-development
      - CB-Development

jobs:
  buildReleaseApk:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          fetch-depth: "0"

      - name: Specify node version
        uses: actions/setup-node@v2-beta
        with:
          node-version: 16

      - name: Use npm caches
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "gradle"

      - name: Install node_modules
        run: npm install --production

      - name: Build
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/build-release-apk.sh

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: cypherbox-android-${{ github.sha }}
          path: ./android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to GitHub Releases (on merge to CB-Development)
        if: github.event_name == 'push' && contains(github.ref, 'CB-Development')
        uses: softprops/action-gh-release@v1
        with:
          files: ./android/app/build/outputs/apk/release/app-release.apk
          tag_name: android-${{ github.sha }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Upload to Play Store (Android)

on:
  push:
    branches:
      - CB-Development
  pull_request:
    branches:
      - Bam-development
      - CB-Development
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          fetch-depth: "0"

      - name: Specify node version
        uses: actions/setup-node@v2-beta
        with:
          node-version: 16

      - name: Use npm caches
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Use specific Java version for sdkmanager to work
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "gradle"

      - name: Install node_modules
        run: npm install --production

      - name: Build
        env:
          KEYSTORE_FILE_HEX: ${{ secrets.KEYSTORE_FILE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/build-release-apk.sh

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: cypherbox-android
          path: ./android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to GitHub Releases (on merge to CB-Development)
        if: github.event_name == 'push' && contains(github.ref, 'CB-Development')
        uses: softprops/action-gh-release@v1
        with:
          files: ./android/app/build/outputs/apk/release/app-release.apk
          tag_name: android-${{ github.sha }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload to GCS for immediate testing on CB-Development
      - name: Upload to GCS for testing
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && (github.ref == 'refs/heads/CB-Development' || github.event_name == 'pull_request')
        env:
          ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
        run: |
          echo "$ANDROID_SERVICE_ACCOUNT" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json --project=cypherbox-app
          
          # Create version tag from commit short SHA
          VERSION_TAG="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          gsutil cp ./android/app/build/outputs/apk/release/app-release.apk gs://cypherbox-test-builds/cypherbox-$VERSION_TAG.apk
          gsutil cp ./android/app/build/outputs/apk/release/app-release.apk gs://cypherbox-test-builds/cypherbox-latest.apk
          
          echo "APK_URL=https://storage.googleapis.com/cypherbox-test-builds/cypherbox-$VERSION_TAG.apk" >> $GITHUB_ENV
          echo "LATEST_URL=https://storage.googleapis.com/cypherbox-test-builds/cypherbox-latest.apk" >> $GITHUB_ENV

      - name: Comment on PR with download link
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && (github.ref == 'refs/heads/CB-Development' || github.event_name == 'pull_request')
        uses: actions/github-script@v7
        with:
          script: |
            const link = process.env.APK_URL;
            const latestLink = process.env.LATEST_URL;
            const body = `📦 **Android APK ready for testing!**\n\n- **Version:** dev-${'${{ github.sha }}'.substring(0, 7)}\n- **Download:** ${latestLink}\n\n_Install on your phone to test. This link always points to the latest build._`;
            
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // For push to CB-Development, find the PR and comment there
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: 'CB-Development',
                state: 'open'
              });
              if (prs.data.length > 0) {
                github.rest.issues.createComment({
                  issue_number: prs.data[0].number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            }

  # Upload to Internal Testing (auto on push to CB-Production)
  upload-internal:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/CB-Production'
    env:
      ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-android
          path: ./build

      - name: Upload to Play Store (Internal Testing)
        run: |
          echo "Uploading to Play Store Internal Testing..."
          echo "$ANDROID_SERVICE_ACCOUNT" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          cd android
          bundle exec fastlane supply \
            --json_key ../gcp-key.json \
            --package_name io.cypherbox.app \
            --track internal \
            --apk ../build/app-release.apk

  # Upload to Production (manual trigger from main)
  upload-production:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.inputs.target == 'production'
    env:
      ANDROID_SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICE_ACCOUNT }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cypherbox-android
          path: ./build

      - name: Upload to Play Store (Production - requires review)
        run: |
          echo "⚠️ Production upload requires Play Store review (typically 1-7 days)"
          echo "$ANDROID_SERVICE_ACCOUNT" | base64 -d > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          cd android
          bundle exec fastlane supply \
            --json_key ../gcp-key.json \
            --package_name io.cypherbox.app \
            --track production \
            --apk ../build/app-release.apk
